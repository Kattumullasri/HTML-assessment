<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body, html {
      height: 100%;
      margin: 0;
    }
    .center-box {
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .box {
      width: 200px;
      height: 100px;
      background-color: lightblue;
    }
  </style>
</head>
<body>
  <div class="center-box">
    <div class="box">Centered Box</div>
  </div>
</body>
</html>
